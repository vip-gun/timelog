# SonarQube analysis settings for this repo. Scan with the local SonarQube in ../sonar:  ../sonar/scan.sh .
# scripts/coverage.sh is run first to produce app/coverage.xml.
sonar.projectKey=timelog
sonar.projectName=TimeLog
sonar.sourceEncoding=UTF-8

sonar.sources=app/timelog,proxy,scripts,docker-compose.yml,app/Dockerfile
sonar.tests=app/tests
sonar.exclusions=**/static/fonts/**,**/__pycache__/**
sonar.python.version=3.12
sonar.python.coverage.reportPaths=app/coverage.xml
# No blame data until the first commit; avoids noisy SCM warnings
sonar.scm.disabled=true
# Front-end assets (app.js, style.css) have no automated test setup (no Node toolchain, offline build):
# excluded from the *coverage* measure only - they are still analysed for bugs, smells and security.
sonar.coverage.exclusions=**/static/**
