{% extends "base.html" %}
{% block title %}Prepare Directory Users{% endblock %}
{% block content %}
{% include "admin/_nav.html" %}
<div class="row-between">
  <h1>Prepare directory (LDAP) users</h1>
  <div class="actions"><a class="btn btn-ghost" href="/admin/users">Back to users</a></div>
</div>
<form method="post" action="/admin/users/ldap" class="card form-grid">
  <input type="hidden" name="csrf_token" value="{{ csrf }}">
  <label class="span-all">Directory usernames <span class="muted small">(sAMAccountName; one per line, or separated by commas or spaces; up to 200)</span>
    <textarea name="usernames" rows="6" required spellcheck="false" autocomplete="off" placeholder="jdoe&#10;asmith"></textarea></label>
  <label class="check span-all"><input type="checkbox" name="lookup" value="1" {% if ldap_enabled %}checked{% endif %}> Look the users up in the directory now (fills names, e-mail, employee ID, team and manager; usernames that are not found are not created)</label>
  <h2 class="span-all">Apply to all of them <span class="muted small">(blank = take it from the directory at sign-in)</span></h2>
  <label>Team <input name="team" list="ldap-team-list" autocomplete="off" placeholder="from the directory"></label>
  <datalist id="ldap-team-list">{% for t in teams %}<option value="{{ t }}">{% endfor %}</datalist>
  <label>Line manager
    <select name="manager_id"><option value="">— from the directory —</option>
      {% for m in managers %}<option value="{{ m.id }}">{{ m.full_name }} ({{ m.username }})</option>{% endfor %}</select></label>
  <label>Expert
    <select name="is_expert"><option value="">— no change —</option><option value="1">Expert</option><option value="0">Not an Expert</option></select></label>
  <label>Grade
    <select name="grade_id"><option value="">default grade</option>
      {% for g in grades %}<option value="{{ g.id }}">{{ g.code }} – {{ g.name }}</option>{% endfor %}</select></label>
  <div class="actions span-all"><button class="btn btn-primary">Prepare accounts</button></div>
</form>
{% endblock %}
