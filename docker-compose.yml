# TimeLog - on-call & overtime tracking.
# Only the `proxy` service publishes ports; `app` and `db` live on the internal network.
name: timelog

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: timelog
      POSTGRES_USER: timelog
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U timelog -d timelog"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]

  app:
    build:
      context: ./app
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-}
        # Shown in the footer; scripts/build.sh fills them in (timestamp defaults to the build time)
        BUILD_TIMESTAMP: ${BUILD_TIMESTAMP:-}
        GIT_COMMIT: ${GIT_COMMIT:-}
    image: timelog-app:${TIMELOG_VERSION:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://timelog:${POSTGRES_PASSWORD}@db:5432/timelog
      SESSION_COOKIE_SECURE: "true"
    volumes:
      # Microsoft PKI CA chain used to validate the LDAPS certificate of the domain controllers.
      - ./certs:/certs:ro
    depends_on:
      db:
        condition: service_healthy
    networks: [internal]

  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      SERVER_NAME: ${SERVER_NAME:?set SERVER_NAME in .env}
      HTTPS_PORT_SUFFIX: ${HTTPS_PORT_SUFFIX:-}
    volumes:
      - ./proxy/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      app:
        condition: service_healthy
    networks: [internal]

volumes:
  db-data:

networks:
  internal:
